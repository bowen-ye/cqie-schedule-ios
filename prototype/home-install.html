<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="cqie课表">
<meta name="referrer" content="no-referrer">
<title>添加 cqie课表到主屏幕</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.hash.slice(1));
  var payload = params.get("home");
  var setup = params.get("setup");
  var preparing = false;
  var installed = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  try { preparing = !!setup && sessionStorage.getItem("kbt-home-install-preparing") === setup; }
  catch (e) { }
  if (installed || !preparing) {
    location.replace(payload ? "./#home=" + encodeURIComponent(payload) : "./");
  }
})();
</script>
</head>
<body>
<main class="auth-gate" aria-labelledby="installReadyTitle">
  <div class="auth-mark" aria-hidden="true">
    <svg viewBox="0 0 64 64"><path d="M12 16h40v36H12zM12 25h40M22 10v12M42 10v12M22 34h8v8h-8z"/></svg>
  </div>
  <h1 id="installReadyTitle">主屏幕入口已准备好</h1>
  <p>课表导入码已复制。现在添加，桌面图标会自动恢复；若没有自动恢复，点“从剪贴板导入”。</p>
  <div class="web-setup">
    <ol class="setup-steps">
      <li>
        <span class="setup-number">1</span>
        <div><strong>点击 Safari“分享”</strong><p>使用底部工具栏中的方框向上箭头。</p></div>
      </li>
      <li>
        <span class="setup-number">2</span>
        <div><strong>选择“添加到主屏幕”</strong><p>保持“作为网页 App 打开”开启，确认名称后点“添加”。</p></div>
      </li>
    </ol>
    <details class="setup-help">
      <summary>已经有桌面图标？</summary>
      <p>不用重复添加。直接回到原来的桌面图标，点“从剪贴板导入课表”即可。</p>
    </details>
    <a class="setup-open" href="./">
      <span>返回课表</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>
  <p class="auth-trust">当前链接只含课表副本，不含账号密码或登录凭证；请勿转发给他人</p>
</main>
</body>
</html>
